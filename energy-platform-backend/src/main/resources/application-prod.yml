spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/energy_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:energy_app}
    password: ${DB_PASSWORD}
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: never
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
app:
  cookie:
    secure: true
