spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/energy_db;MODE=MySQL;DATABASE_TO_UPPER=false;AUTO_SERVER=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
